<script>


/* ==========================================
   VARIABEL
   ========================================== */

let redirectTimer = null;

let currentVideo = null;


/* ==========================================
   PLAY VIDEO
   ========================================== */

function playVideo(videoUrl, directLink) {

    const player =
        document.getElementById("videoPlayer");

    const status =
        document.getElementById("status");


    /* Hentikan timer lama */

    if (redirectTimer) {

        clearTimeout(redirectTimer);

        redirectTimer = null;

    }


    /* Simpan video aktif */

    currentVideo = player;


    /* Simpan direct link */

    player.dataset.directLink =
        directLink;


    /* Masukkan video */

    player.src =
        videoUrl;


    /* Tampilkan player */

    player.style.display =
        "block";


    /* Tampilkan status */

    status.style.display =
        "block";

    status.innerHTML =
        "Memuat video...";


    /* Load video */

    player.load();


    /* Scroll ke video */

    setTimeout(function() {

        player.scrollIntoView({
            behavior: "smooth",
            block: "center"
        });

    }, 100);


    /* Coba play otomatis */

    player.play()
        .then(function() {

            startTimer();

        })
        .catch(function() {

            status.innerHTML =
                "Tekan tombol ▶ pada video untuk mulai.";

        });

}


/* ==========================================
   TIMER 15 DETIK
   ========================================== */

function startTimer() {

    const player =
        document.getElementById("videoPlayer");

    const status =
        document.getElementById("status");


    /* Jangan buat timer ganda */

    if (redirectTimer) {
        return;
    }


    /* Ambil direct link */

    const directLink =
        player.dataset.directLink;


    if (!directLink) {
        return;
    }


    status.innerHTML =
        "Video sedang diputar...";


    /* Timer 15 detik */

    redirectTimer =
        setTimeout(function() {


            /* Pastikan video masih aktif */

            if (currentVideo !== player) {

                redirectTimer = null;

                return;

            }


            /* Hentikan video */

            player.pause();


            /* Status */

            status.innerHTML =
                "Mengalihkan...";


            /* Redirect */

            window.location.href =
                directLink;


        }, 15000);

}


/* ==========================================
   SAAT USER MENEKAN PLAY
   ========================================== */

document
.getElementById("videoPlayer")
.addEventListener(
    "play",
    function() {

        startTimer();

    }
);


/* ==========================================
   JIKA VIDEO DI-PAUSE
   ========================================== */

document
.getElementById("videoPlayer")
.addEventListener(
    "pause",
    function() {

        /*
         * Timer tetap berjalan.
         */

    }
);


</script>
